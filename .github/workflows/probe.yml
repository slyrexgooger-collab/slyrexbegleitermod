name: Probe
on: [push]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - name: runClient
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri > /dev/null
          chmod +x gradlew
          mkdir -p out run
          echo "eula=true" > run/eula.txt
          timeout 420 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient > out/run.log 2>&1 || true
          cp run/logs/latest.log out/latest.log 2>/dev/null || true
          cp -r run/crash-reports out/ 2>/dev/null || true
          cp run/screenshots/*.png out/ 2>/dev/null || true
      - name: Commit
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git add -f out; git commit -m "probe result"; git push origin HEAD:probe-result -f
